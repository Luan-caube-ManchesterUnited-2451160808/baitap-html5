<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h2 style="text-align: center">QUẢN LÝ SINH VIÊN</h2>
        <h5 id="thong-ke" style="text-align: center">
          Tổng số sinh viên: <span id="tong-sv">0</span> | Điểm TB:
          <span id="diem-tb">0</span>
        </h5>
      </header>

      <main>
        <button class="btn-add" onclick="openModal(-1)">Thêm sinh viên</button>
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>Mã SV</th>
              <th>Họ Và Tên</th>
              <th>Ngày Sinh</th>
              <th>Lớp</th>
              <th>Điểm</th>
              <th>Tùy Chỉnh</th>
            </tr>
          </thead>
          <tbody id="student-list"></tbody>
        </table>
      </main>
    </div>

    <div id="studentModal" class="modal">
      <div class="modal-content">
        <h3 id="modalTitle">THÊM SINH VIÊN</h3>

        <form id="studentForm">
          <input type="hidden" id="editIndex" value="-1" />

          <input type="text" id="maSV" placeholder="Mã sinh viên" required />
          <input type="text" id="hoTen" placeholder="Họ và tên" required />
          <input type="date" id="ngaySinh" required />
          <input type="text" id="lopHoc" placeholder="Lớp học" required />
          <input
            type="number"
            id="diemTB"
            placeholder="Điểm trung bình"
            step="0.1"
            min="0"
            max="10"
            required
          />

          <div class="modal-buttons">
            <button type="submit" class="button1">Lưu</button>
            <button type="button" onclick="closeModal()" class="button2">
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
