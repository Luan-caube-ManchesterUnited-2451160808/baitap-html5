<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Interactive App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="B4.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5 text-center">
      <h1 class="mb-4">Keyboard Pro App</h1>
      <p class="text-muted">
        Dùng <code>Ctrl + K</code> để mở lệnh | <code>1-9</code> xem ảnh |
        <code>Space</code> để Slide
      </p>

      <div
        class="gallery-container shadow-lg rounded overflow-hidden bg-dark mx-auto position-relative"
        id="galleryView"
        role="region"
        aria-label="Trình xem ảnh"
      >
        <img src="" id="mainImage" class="img-fluid" alt="Gallery Image" />
        <div
          class="overlay-info p-2 text-white position-absolute bottom-0 start-0 w-100 bg-black bg-opacity-50"
        >
          <span id="imgIndex">Ảnh 1/9</span>
        </div>
        <div
          id="slideStatus"
          class="position-absolute top-0 end-0 p-2 text-warning fw-bold d-none"
        >
          SLIDESHOW ON
        </div>
      </div>
    </div>

    <div
      id="commandPalette"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cmdTitle"
    >
      <div class="command-box shadow-lg">
        <h5 id="cmdTitle" class="visually-hidden">Bảng lệnh hệ thống</h5>
        <div class="p-3 border-bottom">
          <input
            type="text"
            id="cmdInput"
            class="form-control form-control-lg"
            placeholder="Nhập lệnh (vd: Đổi màu, Xóa...)"
            aria-label="Tìm kiếm lệnh"
          />
        </div>
        <ul
          id="cmdList"
          class="list-group list-group-flush"
          role="listbox"
        ></ul>
      </div>
    </div>

    <script src="./B4.js"></script>
  </body>
</html>
