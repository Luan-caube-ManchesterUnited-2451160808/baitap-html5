<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài B2 - Hiệu ứng Animations</title>
    <link rel="stylesheet" href="animations.css" />
  </head>
  <body>
    <div class="container">
      <h1>Minh họa Hiệu ứng Animation</h1>

      <section>
        <h2>1. Loading Spinner</h2>
        <div class="spinner"></div>
      </section>

      <section>
        <h2>2. Product Card Hover (Bay lên, Shadow, Zoom ảnh, Button scale)</h2>
        <div class="product-card fade-in-section">
          <div class="img-container">
            <img
              src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=400"
              alt="Giày"
            />
          </div>
          <div class="info">
            <h3>Giày Chạy Bộ PEAK</h3>
            <p>1.200.000đ</p>
            <button class="btn-buy">Mua ngay</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
