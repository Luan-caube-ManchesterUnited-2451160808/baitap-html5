<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog - JavaScript DOM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="theme-switch shadow" id="themeToggle">
      <i class="bi bi-moon-fill"></i>
    </div>

    <div class="cart-badge-wrapper shadow">
      <i class="bi bi-cart3"></i>
      <span id="cartBadge" class="badge rounded-pill bg-danger">0</span>
    </div>

    <div class="container py-5">
      <header class="text-center mb-5">
        <h1 class="fw-bold">TECH STORE</h1>
        <p class="text-muted">Trải nghiệm mua sắm hoàn toàn bằng JavaScript</p>
      </header>

      <div class="row g-3 mb-4" id="controls">
        <div class="col-md-4">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Tìm kiếm sản phẩm..."
          />
        </div>
        <div class="col-md-4">
          <div class="btn-group w-100" id="categoryFilters">
            <button class="btn btn-outline-primary active" data-cat="all">
              Tất cả
            </button>
            <button class="btn btn-outline-primary" data-cat="phone">
              Điện thoại
            </button>
            <button class="btn btn-outline-primary" data-cat="laptop">
              Laptop
            </button>
            <button class="btn btn-outline-primary" data-cat="watch">
              Đồng hồ
            </button>
          </div>
        </div>
        <div class="col-md-4">
          <select id="sortSelect" class="form-select">
            <option value="none">Sắp xếp theo...</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
            <option value="name-az">Tên A-Z</option>
            <option value="rating-high">Đánh giá cao nhất</option>
          </select>
        </div>
      </div>

      <div class="row g-4" id="productGrid"></div>
    </div>

    <div id="modalContainer"></div>

    <script src="script.js"></script>
  </body>
</html>
