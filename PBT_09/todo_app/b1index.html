<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Todo App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="b1style.css" />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="todo-wrapper shadow-sm">
        <header class="text-center mb-4">
          <h1 class="display-5 fw-bold text-primary">To-Do List</h1>
        </header>

        <div class="input-group mb-3">
          <input
            type="text"
            id="todoInput"
            class="form-control form-control-lg"
            placeholder="Việc cần làm hôm nay là gì?"
          />
          <button class="btn btn-primary px-4" id="addBtn">
            <i class="bi bi-plus-lg"></i> Thêm
          </button>
        </div>

        <ul id="todoList" class="list-group mb-4"></ul>

        <footer
          class="d-flex flex-wrap justify-content-between align-items-center pt-3 border-top"
        >
          <span id="todoCount" class="text-muted fw-medium small"
            >0 mục còn lại</span
          >

          <div class="filter-group d-flex gap-1" id="filterGroup">
            <button
              class="btn btn-sm btn-outline-primary active"
              data-filter="all"
            >
              Tất cả
            </button>
            <button class="btn btn-sm btn-outline-primary" data-filter="active">
              Chưa xong
            </button>
            <button
              class="btn btn-sm btn-outline-primary"
              data-filter="completed"
            >
              Đã xong
            </button>
          </div>

          <button
            id="clearCompleted"
            class="btn btn-sm btn-link text-danger text-decoration-none small"
          >
            Xóa mục đã xong
          </button>
        </footer>
      </div>
    </div>

    <script src="./b1app.js"></script>
  </body>
</html>
